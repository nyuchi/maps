<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Nyuchi Maps — Africa at street level</title>
    <meta
      name="description"
      content="An open map of Africa, served from our own tiles. No accounts, no cookies, no trackers."
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1c1b19"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/vendor/maplibre-gl/6.19.0/maplibre-gl.css" />
    <link rel="stylesheet" href="/assets/app.15ed10e969.css" />
    <link rel="modulepreload" href="/assets/vendor/maplibre-gl/6.19.0/maplibre-gl.mjs" />
    <script type="module" src="/assets/app.3ba9e5bb6e.js"></script>
  </head>
  <body>
    <header class="bar">
      <h1 class="brand">Nyuchi Maps</h1>
      <button
        id="theme"
        class="chip"
        type="button"
        role="switch"
        aria-checked="false"
      >
        <span class="chip-mark" aria-hidden="true"></span>
        Dark map
      </button>
    </header>
    <main id="map" aria-label="Map of Africa"></main>
    <div id="status" class="status" role="status" hidden>
      <p id="status-text"></p>
      <button id="retry" class="chip" type="button">Try again</button>
    </div>
    <noscript>
      <p class="status">
        The map needs JavaScript. The same tiles and styles are available as an
        open API, see /openapi.json.
      </p>
    </noscript>
  </body>
</html>
